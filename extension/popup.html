<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>稿台多平台分发</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      font-size: 13px;
      color: #0f0f0f;
      background: #f2efe6;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 3px solid #0f0f0f;
      background: #ffd429;
    }
    .head img {
      width: 26px;
      height: 26px;
      border: 2px solid #0f0f0f;
      background: #fff;
    }
    .head strong {
      font-size: 14px;
      font-weight: 900;
    }
    .body {
      padding: 14px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #ffffff;
      border: 2px solid #0f0f0f;
      box-shadow: 3px 3px 0 #0f0f0f;
      margin-bottom: 12px;
      font-weight: 800;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #0f0f0f;
    }
    .dot.on { background: #2fd07a; }
    .dot.off { background: #6b6862; }
    .hint {
      font-size: 12px;
      color: #6b6862;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .platforms {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .plat {
      padding: 8px 6px;
      text-align: center;
      background: #ffffff;
      border: 2px solid #0f0f0f;
      border-radius: 2px;
      font-weight: 700;
      font-size: 12px;
    }
    .foot {
      font-size: 11px;
      color: #6b6862;
      line-height: 1.5;
      border-top: 2px solid #0f0f0f;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="head">
    <img src="icon.png" alt="" />
    <strong>稿台多平台分发</strong>
  </div>
  <div class="body">
    <div class="status">
      <span class="dot off" id="dot"></span>
      <span id="statusText">未连接</span>
    </div>
    <p class="hint" id="hint">请确认稿台桌面版已启动。</p>
    <div class="platforms">
      <div class="plat">知乎</div>
      <div class="plat">掘金</div>
      <div class="plat">CSDN</div>
      <div class="plat">小红书</div>
      <div class="plat">飞书</div>
    </div>
    <div class="foot">
      在稿台的「多平台分发」页选择平台与稿件并推送，文章会自动填入当前浏览器页面的编辑器。
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
