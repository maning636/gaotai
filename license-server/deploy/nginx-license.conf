# 稿台授权服务 nginx 站点配置（放到 /etc/nginx/conf.d/gaotai-license.conf）。
#
# 为什么单独一个子域名：根域名 maning789link.top 已被 fde 与 prism-cloud 两个站点占用，
# 共用根域名只能靠 location 前缀区分，任何一方改路由都会互相踩到。
#
# 证书用 certbot --nginx -d license.maning789link.top --redirect 自动补 443 段，
# 不要手写 ssl_certificate 路径——续期后指向会变。
server {
    listen 80;
    listen [::]:80;
    server_name license.maning789link.top;

    # 领码页是手机打开的普通网页，不需要大请求体
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
