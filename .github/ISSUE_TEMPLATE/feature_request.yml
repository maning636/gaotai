name: 功能建议
description: 提出新产品能力或现有工作流的改进建议
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        请先说明用户问题，再描述方案；涉及架构或门禁规则的改动需要另写 ADR。
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景下遇到什么困难
      placeholder: 当前工作流中缺失或低效的部分
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望增加或改变什么，尽量描述可观察的使用结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的其他做法，以及为什么不采用
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 用可检查的条件说明怎样才算完成
      placeholder: |
        - 给定……
        - 当……
        - 则……
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 可能涉及的页面、接口、文档、数据或打包链路
