name: Bug 报告
description: 报告可复现的缺陷、异常行为或回归问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认没有包含密钥、客户数据、数据库或日志中的敏感信息。
  - type: input
    id: summary
    attributes:
      label: 问题摘要
      description: 用一句话说明发生了什么
      placeholder: 例如：推送草稿时图片没有上传
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 产品版本
      description: 填写界面或 package.json 中的版本号
      placeholder: 0.8.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、桌面版或开发态、相关依赖版本
      placeholder: Windows 11 / 桌面版 / Node 24
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 按顺序列出从进入到问题出现的操作
      placeholder: |
        1. 打开稿件
        2. 执行推送
        3. 观察结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 说明异常表现；可附脱敏后的报错或截图
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充证据
      description: 最小复现、相关提交、截图位置或已尝试的排查
      render: text
